<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Payment Verification & Order Status | FOK Academy" />
  <title>Payment Status | FOK Academy HDFC SmartGateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background:
        radial-gradient(circle at top right, rgba(231, 169, 21, 0.18), transparent 28%),
        linear-gradient(180deg, #fffdf7 0%, #fbfaf7 48%, #f4f1e8 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .status-header {
      padding: 18px 0;
      border-bottom: 1px solid rgba(25, 50, 76, 0.08);
      background: rgba(251, 250, 247, 0.9);
      backdrop-filter: blur(14px);
    }

    .status-header .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .status-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 20px 72px;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(231, 169, 21, 0.28);
      border-radius: 32px;
      padding: 42px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 24px 70px rgba(14, 33, 53, 0.12);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .status-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: linear-gradient(90deg, var(--gold), #ffd56a);
    }

    .status-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      font-size: 32px;
    }

    .status-icon.success {
      background: rgba(16, 185, 129, 0.12);
      color: var(--green);
      border: 2px solid var(--green);
    }

    .status-icon.failed {
      background: rgba(239, 68, 68, 0.08);
      color: var(--red);
      border: 2px solid var(--red);
    }

    .status-icon.loading {
      background: rgba(231, 169, 21, 0.12);
      color: var(--gold);
      border: 2px solid var(--gold);
    }

    .status-card h1 {
      font-family: "Manrope", sans-serif;
      font-size: 32px;
      margin: 0 0 10px;
      color: var(--navy);
      letter-spacing: -0.03em;
    }

    .status-card p {
      color: #5d6c7d;
      font-size: 16px;
      margin: 0 0 26px;
    }

    .receipt-box {
      background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(251,250,247,0.94) 100%);
      border: 1px solid rgba(25, 50, 76, 0.09);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 26px;
      text-align: left;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(25, 50, 76, 0.12);
      font-size: 14px;
      gap: 12px;
    }

    .receipt-row:last-child {
      border-bottom: none;
    }

    .receipt-row span {
      color: #6a7685;
    }

    .receipt-row strong {
      color: var(--navy);
      text-align: right;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-group .btn {
      border-radius: 999px;
      min-height: 62px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      box-shadow: 0 18px 35px rgba(14, 33, 53, 0.12);
    }

    .btn-whatsapp {
      background: #25D366;
      color: white;
      font-weight: 700;
      border: none;
    }

    .btn-whatsapp:hover {
      background: #20bd5a;
    }

    /* Mock Gateway Interface Styling */
    .mock-gateway-header {
      background: #004c8f;
      color: white;
      padding: 16px;
      border-radius: 18px 18px 0 0;
      margin: -40px -40px 25px -40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mock-badge {
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
    }

    .mock-pay-methods {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
      text-align: left;
    }

    .pay-option {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .pay-option input {
      accent-color: var(--gold);
    }

    @media (max-width: 640px) {
      .status-card {
        padding: 32px 22px;
        border-radius: 26px;
      }

      .status-card h1 {
        font-size: 28px;
      }

      .receipt-row {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <header class="status-header">
    <div class="container">
      <a class="brand" href="index.html">
        <img src="assets/fok-logo.png" alt="FOK Academy Logo" style="height: 36px;" />
        <div class="brand-text">
          <strong style="color: var(--navy);">FOK</strong>
          <span style="color: var(--gold);">ACADEMY</span>
        </div>
      </a>
    </div>
  </header>

  <main class="status-container">
    <div class="status-card" id="statusCard">
      <!-- Dynamic Content loaded by JavaScript -->
      <div class="status-icon loading" id="statusIcon">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
      </div>
      <h1 id="statusTitle">Verifying Payment...</h1>
      <p id="statusMsg">Connecting to HDFC SmartGateway server to confirm transaction status.</p>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const isMockCheckout = urlParams.get('mock_checkout') === '1';
      const orderId = urlParams.get('order_id');
      const mockAction = urlParams.get('mock_action');
      const amount = urlParams.get('amount') || '499';
      const name = urlParams.get('name') || 'Student';
      const email = urlParams.get('email') || '';

      const statusCard = document.getElementById('statusCard');

      // 1. MOCK HDFC SMARTGATEWAY SIMULATOR SCREEN
      if (isMockCheckout && orderId) {
        statusCard.innerHTML = `
          <div class="mock-gateway-header">
            <div>
              <small>HDFC BANK SMARTGATEWAY</small>
              <div style="font-weight:700;">Secure Checkout Simulator</div>
            </div>
            <span class="mock-badge">TEST ENVIRONMENT</span>
          </div>

          <div style="text-align: left; margin-bottom: 15px;">
            <div style="color: #94a3b8; font-size: 12px;">MERCHANT</div>
            <strong style="font-size: 16px;">FOK Academy Amazon Masterclass</strong>
            <div style="color: var(--gold); font-size: 24px; font-weight: 800; margin-top: 4px;">₹${amount}.00</div>
          </div>

          <div class="mock-pay-methods">
            <label class="pay-option">
              <input type="radio" name="pay_mode" value="upi" checked />
              <i class="fa-brands fa-google-pay text-gold"></i>
              <span>UPI (Google Pay / PhonePe / Paytm / BHIM)</span>
            </label>

            <label class="pay-option">
              <input type="radio" name="pay_mode" value="card" />
              <i class="fa-solid fa-credit-card text-gold"></i>
              <span>HDFC Debit / Credit Card</span>
            </label>

            <label class="pay-option">
              <input type="radio" name="pay_mode" value="netbanking" />
              <i class="fa-solid fa-building-columns text-gold"></i>
              <span>HDFC NetBanking</span>
            </label>
          </div>

          <div class="action-group">
            <button onclick="simulatePayment('SUCCESS')" class="btn btn-gold full btn-large">
              <i class="fa-solid fa-check-circle"></i> Pay ₹${amount} (Simulate Success)
            </button>
            <button onclick="simulatePayment('FAILURE')" class="btn full" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4);">
              <i class="fa-solid fa-xmark"></i> Simulate Failed Payment
            </button>
          </div>
        `;
        return;
      }

          <span style="color: var(--gold);">ACADEMY</span>
        </div>
      </a>
    </div>
  </header>

  <main class="status-container">
    <div class="status-card" id="statusCard">
      <!-- Dynamic Content loaded by JavaScript -->
      <div class="status-icon loading" id="statusIcon">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
      </div>
      <h1 id="statusTitle">Verifying Payment...</h1>
      <p id="statusMsg">Connecting to HDFC SmartGateway server to confirm transaction status.</p>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const isMockCheckout = urlParams.get('mock_checkout') === '1';
      const orderId = urlParams.get('order_id');
      const mockAction = urlParams.get('mock_action');
      const amount = urlParams.get('amount') || '499';
      const name = urlParams.get('name') || 'Student';
      const email = urlParams.get('email') || '';

      const statusCard = document.getElementById('statusCard');

      // 1. MOCK HDFC SMARTGATEWAY SIMULATOR SCREEN
      if (isMockCheckout && orderId) {
        statusCard.innerHTML = `
          <div class="mock-gateway-header">
            <div>
              <small>HDFC BANK SMARTGATEWAY</small>
              <div style="font-weight:700;">Secure Checkout Simulator</div>
            </div>
            <span class="mock-badge">TEST ENVIRONMENT</span>
          </div>

          <div style="text-align: left; margin-bottom: 15px;">
            <div style="color: #94a3b8; font-size: 12px;">MERCHANT</div>
            <strong style="font-size: 16px;">FOK Academy Amazon Masterclass</strong>
            <div style="color: var(--gold); font-size: 24px; font-weight: 800; margin-top: 4px;">₹${amount}.00</div>
          </div>

          <div class="mock-pay-methods">
            <label class="pay-option">
              <input type="radio" name="pay_mode" value="upi" checked />
              <i class="fa-brands fa-google-pay text-gold"></i>
              <span>UPI (Google Pay / PhonePe / Paytm / BHIM)</span>
            </label>

            <label class="pay-option">
              <input type="radio" name="pay_mode" value="card" />
              <i class="fa-solid fa-credit-card text-gold"></i>
              <span>HDFC Debit / Credit Card</span>
            </label>

            <label class="pay-option">
              <input type="radio" name="pay_mode" value="netbanking" />
              <i class="fa-solid fa-building-columns text-gold"></i>
              <span>HDFC NetBanking</span>
            </label>
          </div>

          <div class="action-group">
            <button onclick="simulatePayment('SUCCESS')" class="btn btn-gold full btn-large">
              <i class="fa-solid fa-check-circle"></i> Pay ₹${amount} (Simulate Success)
            </button>
            <button onclick="simulatePayment('FAILURE')" class="btn full" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4);">
              <i class="fa-solid fa-xmark"></i> Simulate Failed Payment
            </button>
          </div>
        `;
        return;
      }

      // Helper function for simulation trigger
      window.simulatePayment = function(action) {
        window.location.href = `/payment-status.html?order_id=${encodeURIComponent(orderId)}&mock_action=${action}`;
      };

      // 2. VERIFY ORDER STATUS VIA BACKEND API
      if (orderId) {
        try {
          const res = await fetch(`/api/verify-payment?order_id=${encodeURIComponent(orderId)}${mockAction ? `&mock_action=${mockAction}` : ''}`);
          const data = await res.json();

          console.log('[ORDER STATUS API DATA]:', data);
          console.log('[ORDER STATUS API JSON FORMAT]:', JSON.stringify(data, null, 2));

          const paymentMethodLabel = data?.order?.paymentMethodType || 'HDFC Bank SmartGateway';

          if (data.success && data.order && data.order.verified === true) {
            // SUCCESSFUL PAYMENT SCREEN
            statusCard.innerHTML = `
              <div class="status-icon success">
                <i class="fa-solid fa-check"></i>
              </div>
              <h1>Enrollment Confirmed! 🎉</h1>
              <p>Welcome to FOK Academy! Your payment was processed securely via HDFC SmartGateway.</p>

              <div class="receipt-box">
                <div class="receipt-row"><span>Order ID</span><strong>${data.order.orderId}</strong></div>
                <div class="receipt-row"><span>Student Name</span><strong>${data.order.customerName || name}</strong></div>
                <div class="receipt-row"><span>Amount Paid</span><strong>₹${data.order.amount}.00</strong></div>
                <div class="receipt-row"><span>Payment Method</span><strong>${paymentMethodLabel}</strong></div>
                <div class="receipt-row"><span>Status</span><strong style="color: var(--green);">PAID & VERIFIED</strong></div>
              </div>

              <div class="action-group">
                <a href="https://chat.whatsapp.com/demo-fok-community" target="_blank" class="btn btn-whatsapp full btn-large">
                  <i class="fa-brands fa-whatsapp"></i> Join Exclusive Student WhatsApp Group →
                </a>
                <a href="index.html" class="btn btn-gold full" style="background: transparent; border: 1px solid var(--gold);">
                  Return to Home Page
                </a>
              </div>
            `;
          } else if (data.success && data.order && data.order.status === 'CHARGED') {
            statusCard.innerHTML = `
              <div class="status-icon loading">
                <i class="fa-solid fa-hourglass-half"></i>
              </div>
              <h1>Payment Awaiting Confirmation</h1>
              <p>We received a sandbox gateway update, but the payment is not fully verified yet. Please wait a moment and check again.</p>

              <div class="receipt-box">
                <div class="receipt-row"><span>Order ID</span><strong>${data.order.orderId}</strong></div>
                <div class="receipt-row"><span>Amount</span><strong>₹${data.order.amount || amount}.00</strong></div>
                <div class="receipt-row"><span>Status</span><strong style="color: var(--gold);">${data.order.status}</strong></div>
                <div class="receipt-row"><span>Verification</span><strong>${data.order.verificationSource || 'Pending'}</strong></div>
              </div>

              <div class="action-group">
                <a href="javascript:window.location.reload()" class="btn btn-gold full btn-large">
                  Check Status Again
                </a>
                <a href="index.html#offer" class="btn btn-gold full" style="background: transparent; border: 1px solid var(--gold);">
                  Return to Checkout
                </a>
              </div>
            `;
          } else {
            // FAILED PAYMENT SCREEN
            statusCard.innerHTML = `
              <div class="status-icon failed">
                <i class="fa-solid fa-xmark"></i>
              </div>
              <h1>Payment Incomplete</h1>
              <p>Your payment attempt was cancelled or failed to process with HDFC SmartGateway.</p>

              <div class="receipt-box">
                <div class="receipt-row"><span>Order ID</span><strong>${orderId}</strong></div>
                <div class="receipt-row"><span>Status</span><strong style="color: #ef4444;">CANCELLED / FAILED</strong></div>
              </div>

              <div class="action-group">
                <a href="index.html#offer" class="btn btn-gold full btn-large">
                  Try Enrolling Again →
                </a>
              </div>
            `;
          }
        } catch (err) {
          console.error(err);
          document.getElementById('statusMsg').textContent = 'Unable to verify order. Please contact support.';
        }
      } else {
        // Direct Visit without order
        statusCard.innerHTML = `
          <div class="status-icon loading"><i class="fa-solid fa-info"></i></div>
          <h1>No Active Payment Session</h1>
          <p>Please select a workshop plan from the landing page to begin enrollment.</p>
          <a href="index.html" class="btn btn-gold full btn-large">Go to Landing Page</a>
        `;
      }
    });
  </script>
</body>
</html>
